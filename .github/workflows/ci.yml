name: Custom Python Tests

on: [push, pull_request]

jobs:
  run-custom-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write Strava token from secret
        env:
          STRAVA_TOKEN_JSON: ${{ secrets.STRAVA_TOKEN_JSON }}
        run: |
          if [ -z "$STRAVA_TOKEN_JSON" ]; then
            echo "Missing STRAVA_TOKEN_JSON secret"
            exit 1
          fi
          printf '%s' "$STRAVA_TOKEN_JSON" > strava_token.json

      - name: Run tests
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          DEV_URL: ${{ secrets.DEV_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          python test.py | sed 's/\x1b\[[0-9;]*m//g' > test_results.log 2>&1
          EXIT_CODE=$?

          echo "### Tests results" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          grep "Executing test" test_results.log | while read -r line; do
            NAME=$(echo $line | awk -F'test ' '{print $2}' | awk -F':' '{print $1}')
            STATUS=$(echo $line | grep -q "Success" && echo "✅ Success" || echo "❌ Failed")
            TIME=$(echo $line | grep -o '([0-9.]*s)')
            echo "| $NAME | $STATUS | $TIME |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -eq 0 ]; then
            echo "**Result :** All tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result :** Some tests failed." >> $GITHUB_STEP_SUMMARY
          fi

          echo "<details><summary>Logs</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

          exit $EXIT_CODE

  deploy-dev:
    needs: run-custom-tests
    runs-on: self-hosted
    if: github.ref == 'refs/heads/dev'
    
    steps:
      - name: Pull latest code
        run: |
          cd /home/dev/Training-Tracker
          git pull origin dev

      - name: Update dependencies
        run: |
          cd /home/dev/Training-Tracker
          ./venv/bin/pip install -r requirements.txt

      - name: Restart Application
        run: |          
          pkill -f main.py || true
          nohup ./venv/bin/python main.py > app.log 2>&1 &